# This file contains common pin mappings for the Fysetc S6 v2 board.  To use
# this config, the firmware should be compiled for the STM32F446 with a "64KiB
# bootloader".  When calling "menuconfig", enable "extra low-level configuration
# setup" and select the "12MHz crystal" as clock reference.

# See docs/Config_Reference.md for a description of parameters.

[include mainsail.cfg]
[include KAMP_Settings.cfg]

[stepper_x]
step_pin: PE11
dir_pin: PE10
enable_pin: !PE9
microsteps: 16
rotation_distance: 40
homing_speed: 20
#endstop_pin: ^PB14  # PA1 for X-max
endstop_pin: tmc2209_stepper_x:virtual_endstop
homing_retract_dist: 0
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: PD8
dir_pin: PB12
enable_pin: !PD9
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PB13  # PA2 for Y-max
position_endstop: 0
position_max: 240
homing_speed: 50

[stepper_z]
step_pin: PD14
dir_pin: !PD13
enable_pin: !PD15
microsteps: 16
rotation_distance: 4
#endstop_pin: ^PA0  # PA3 for Z-max
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min = -5
homing_speed: 50 

[extruder]
step_pin: PD5
dir_pin: !PD6
enable_pin: !PD4
microsteps: 16
rotation_distance: 5.586
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB3
sensor_type: PT1000
sensor_pin: PC0
# For KAMP
max_extrude_cross_section: 5
#control: pid
#pid_Kp: 22
#pid_Ki: 1.08
#pid_Kd: 114
min_temp: 0
max_temp: 260

#[extruder1]
#step_pin: PE6
#dir_pin: !PC13
#enable_pin: !PE5
#heater_pin: PB4
#sensor_pin: PC1

#[extruder2]
#step_pin: PE2
#dir_pin: !PE4
#enable_pin: !PE3
#heater_pin: PB15
#sensor_pin: PC2

[heater_bed]
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC3
#control: watermark
min_temp: 0
max_temp: 130

[multi_pin part_fans]
pins: PB0, PB1
#   A comma separated list of pins associated with this alias. This
#   parameter must be provided.

#fan for printed model FAN0
[fan]
pin: multi_pin:part_fans

#fan for hotend FAN1
#[heater_fan heatbreak_cooling_fan]
#pin: PB1
#shutdown_speed: 1
#[fan_generic Left]
#pin: PB1

#fan for control board FAN2
[heater_fan Hotend]
pin: PB2
heater: extruder
heater_temp: 40.0
#[fan_generic Hotend]
#pin: PB2

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_47003A000B50563046363120-if00

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 10
max_z_accel: 100

#3D Touch

[bltouch]
#stow_on_each_sample: False
#probe_with_touch_mode: False 
sensor_pin: ^PA0
control_pin: PA3
#z_offset: 0
samples: 1
#x_offset: -43
#y_offset: -6
#x_offset: -40
x_offset: 1
y_offset: -41
#pin_up_reports_not_triggered: False
#pin_up_touch_mode_reports_triggered: False

#[safe_z_home]
#home_xy_position: 115,115 # Change coordinates to the center of your print bed
#speed: 50
#z_hop: 10                 # Move up 10mm
#z_hop_speed: 5

[bed_screws]
screw1: 15,15
screw2: 15,205
screw3: 195,205
screw4: 195,30

[screws_tilt_adjust]
horizontal_move_z: 10
screw1: 2,40
screw1_name: front left
screw2: 2,239
screw2_name: back left
screw3: 197,239
screw3_name: back right
screw4: 197,40
screw4_name: front right
screw_thread: CW-M4

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 1, 5
mesh_max: 195, 199
algorithm: bicubic
mesh_pps: 1
probe_count: 12, 12

#Board and Pi temps

[temperature_sensor raspberry_pi]

sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor mcu_temp]

sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[exclude_object]

########################################
# TMC UART configuration
########################################

[tmc2209 stepper_x]
uart_pin: PE8
run_current: 0.6
diag_pin: PB14
driver_SGTHRS: 64  # 255 is most sensitive value, 0 is least sensitive
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: PC4
run_current: 0.6
stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: PD12
run_current: 0.7
stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: PA15
run_current: 0.7
stealthchop_threshold: 999999

